name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build 3Draper Viewer WASM
        working-directory: crates/draper-viewer
        # Trunk.toml specifies --package draper-viewer to avoid building
        # non-WASM crates. The web feature disables export-3mf (zip/bzip2/lzma C deps).
        # --public-url /3Draper/ makes assets load from the GitHub Pages subpath.
        run: trunk build --release --public-url /3Draper/

      - name: Build BRepCAD WASM
        working-directory: crates/draper-viewer
        # Build BRepCAD into dist-brepcad/ using a separate Trunk config.
        # --public-url /3Draper/ makes assets load from the GitHub Pages subpath.
        run: trunk build --release --public-url /3Draper/ --config Trunk.brepcad.toml brepcad.html

      - name: Merge BRepCAD into dist
        working-directory: crates/draper-viewer
        # Copy BRepCAD build output (brepcad.html + brepcad-shell-*.wasm/.js)
        # into the main dist/ directory so both apps are served from one site.
        # The brepcad-shell assets have unique names (brepcad-shell-*) so they
        # don't collide with the draper-viewer assets.
        run: |
          cp -r dist-brepcad/* dist/
          ls -la dist/

      - name: Add .nojekyll
        working-directory: crates/draper-viewer/dist
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/draper-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
