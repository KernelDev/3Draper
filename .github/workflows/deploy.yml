name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm32 sysroot headers
        run: |
          # Install a C compiler toolchain for wasm32 target
          # This is needed by native C dependencies (bzip2-sys, zstd-sys, etc.)
          # that are pulled in transitively even when building only draper-viewer
          rustup target add wasm32-unknown-unknown
          # Install wasi-sysroot so clang can find stdlib.h for wasm32
          sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build WASM
        working-directory: crates/draper-viewer
        run: trunk build --release --public-url /3Draper/
        env:
          # Only build draper-viewer and its deps, not the whole workspace
          # This avoids pulling in draper-cloud (tokio) and draper-testing
          # which don't compile on wasm32
          TRUNK_CARGO_FLAGS: "--package draper-viewer"

      - name: Add .nojekyll
        working-directory: crates/draper-viewer/dist
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/draper-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
