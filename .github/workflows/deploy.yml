name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Configure WASM build flags
        # wasm-bindgen-rayon requires atomics and bulk-memory features.
        # These are stable since Rust 1.87+ but need to be explicitly enabled
        # via RUSTFLAGS. Without these, wasm-bindgen-rayon's compile_error!
        # triggers and the build fails.
        run: |
          echo "RUSTFLAGS=-C target-feature=+atomics,+bulk-memory,+mutable-globals" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build WASM
        working-directory: crates/draper-viewer
        # Trunk.toml specifies --package draper-viewer to avoid building
        # non-WASM crates. The web feature disables export-3mf (zip/bzip2/lzma C deps).
        run: trunk build --release --public-url /3Draper/

      - name: Add .nojekyll
        working-directory: crates/draper-viewer/dist
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/draper-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
