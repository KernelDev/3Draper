name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install WASI SDK for C deps on wasm32
        run: |
          # Install wasi-libc which provides stdlib.h and other C headers
          # needed by native C dependencies (bzip2-sys, lzma-sys, zstd-sys)
          # when cross-compiling to wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y clang lld llvm wasi-libc

          # Set environment variables so cc-rs can find the WASI sysroot
          echo "WASI_SYSROOT=/usr/share/wasi-sysroot" >> $GITHUB_ENV
          echo "CC_wasm32_unknown_unknown=clang --target=wasm32-wasi --sysroot=/usr/share/wasi-sysroot" >> $GITHUB_ENV
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build WASM
        working-directory: crates/draper-viewer
        run: trunk build --release --public-url /3Draper/

      - name: Add .nojekyll
        working-directory: crates/draper-viewer/dist
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/draper-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
