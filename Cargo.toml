[workspace]
resolver = "2"
members = [
    "crates/draper-geometry",
    "crates/draper-topology",
    "crates/draper-step",
    "crates/draper-mesh",
    "crates/draper-core",
    "crates/draper-ffi",
    "crates/draper-wasm",
    "crates/draper-worker",
    "crates/draper-viewer",
    "crates/draper-cloud",
    "crates/draper-ai",
    "crates/draper-implicit",
    "crates/draper-subd",
    "crates/draper-compute",
    "crates/draper-sketch",
    "crates/draper-testing",
    "crates/draper-json",
    "tools",
]

# Only these crates are built by default (cargo build without -p).
# Crates that don't compile on wasm32 (draper-cloud with tokio, draper-testing)
# are excluded from default-members so that `trunk build` only resolves
# the WASM-compatible dependency graph.
default-members = [
    "crates/draper-geometry",
    "crates/draper-topology",
    "crates/draper-step",
    "crates/draper-mesh",
    "crates/draper-core",
    "crates/draper-ffi",
    "crates/draper-viewer",
    "tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/KernelDev/3Draper"

[workspace.dependencies]
# Internal crates
draper-geometry = { path = "crates/draper-geometry" }
draper-topology = { path = "crates/draper-topology" }
draper-step = { path = "crates/draper-step" }
draper-mesh = { path = "crates/draper-mesh", default-features = false }
draper-core = { path = "crates/draper-core" }
draper-cloud = { path = "crates/draper-cloud" }
draper-ai = { path = "crates/draper-ai" }
draper-implicit = { path = "crates/draper-implicit" }
draper-subd = { path = "crates/draper-subd" }
draper-compute = { path = "crates/draper-compute" }
draper-sketch = { path = "crates/draper-sketch" }
draper-testing = { path = "crates/draper-testing" }
draper-json = { path = "crates/draper-json" }
draper-wasm = { path = "crates/draper-wasm" }

# Math & numerics
nalgebra = "0.33"
num-traits = "0.2"
approx = "0.5"

# Algorithms
earcutr = "0.2"
earcut = "0.4"
i_triangle = "0.45"
delaunator = "1"
thiserror = "2"
anyhow = "1"

# Rendering
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu", "default_fonts"] }
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# FFI
cbindgen = "0.27"

# Logging
log = "0.4"
env_logger = "0.11"

# Testing (ROADMAP_VISION_2036 §9.2, §9.3)
proptest = "1"
quickcheck = "1"
