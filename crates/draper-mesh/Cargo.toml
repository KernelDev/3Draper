[package]
name = "draper-mesh"
version.workspace = true
edition.workspace = true

[features]
default = []
# 3MF export requires the `zip` crate which has C dependencies
# (bzip2-sys, lzma-sys, zstd-sys) that don't compile on wasm32.
# Only enable this for native builds.
export-3mf = ["zip", "serde", "dep:serde_json"]
serde = ["dep:serde", "dep:serde_json", "draper-geometry/serde"]
# WASM parallel: enables rayon threading on wasm32 via wasm-bindgen-rayon.
# Requires the JS host to initialize a Web Worker pool with SharedArrayBuffer.
wasm-parallel = ["wasm-bindgen-rayon"]
# A3 (BREP_CORE_FIX_PLAN Этап D): strict mode — turns mesh-pipeline
# workaround layers into hard errors so CI can catch regressions that
# default mode only logs:
#   * `PrimaryTriangulationFailed` (D4: primary triangulation returned
#     an empty mesh for a face — a bug for valid solids)
#   * `weld_boundary_edge_vertices_aggressive` invocation (D2: the
#     topology-violating aggressive weld still fires)
# Not for production: industrial STEP files (transmission, Vulcan)
# legitimately exercise the aggressive weld today.
strict = []

[dependencies]
draper-geometry = { workspace = true }
draper-topology = { workspace = true }
earcutr = { workspace = true }
earcut = { workspace = true }
i_triangle = { workspace = true }
delaunator = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
rayon = "1.10"
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
wasm-bindgen-rayon = { version = "1.2", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
