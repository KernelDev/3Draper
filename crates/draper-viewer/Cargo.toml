[package]
name = "draper-viewer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "draper-viewer"
path = "src/main.rs"

[features]
default = ["native"]
native = ["rfd", "env_logger", "draper-mesh/export-3mf", "rayon"]
web = ["web-sys", "wasm-bindgen", "console_log", "wasm-bindgen-futures", "js-sys", "web-time", "wgpu/webgl", "wgpu/webgpu", "console_error_panic_hook", "draper-mesh/wasm-parallel", "futures-channel", "serde"]
# web-deploy: same as 'web' but without wasm-parallel (wasm-bindgen-rayon).
# Used for GitHub Pages deployment where SharedArrayBuffer/COOP/COEP
# headers are unavailable. The atomics target feature required by
# wasm-bindgen-rayon is unstable on stable Rust, so this feature
# avoids the compile error while still providing full WASM functionality
# in single-threaded mode.
web-deploy = ["web-sys", "wasm-bindgen", "console_log", "wasm-bindgen-futures", "js-sys", "web-time", "wgpu/webgl", "wgpu/webgpu", "console_error_panic_hook", "futures-channel", "serde"]

[dependencies]
draper-geometry = { workspace = true }
draper-topology = { workspace = true }
draper-mesh = { workspace = true, default-features = false }
draper-core = { workspace = true }
draper-step = { workspace = true }
draper-json = { workspace = true }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = { workspace = true }
egui-wgpu = { version = "0.31" }
wgpu = { version = "24", features = ["webgl", "webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
log = { workspace = true }
serde_json = "1"

# Native-only dependencies
rfd = { version = "0.15", optional = true }
env_logger = { version = "0.11", optional = true }
rayon = { version = "1.10", optional = true }

# Web-only dependencies
web-sys = { version = "0.3", optional = true, features = [
    "HtmlInputElement",
    "HtmlElement",
    "HtmlCanvasElement",
    "File",
    "FileReader",
    "FileList",
    "Event",
    "EventTarget",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Window",
    "Element",
    "Performance",
    "OffscreenCanvas",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Url",
] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_log = { version = "1", optional = true }
js-sys = { version = "0.3", optional = true }
web-time = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
futures-channel = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
