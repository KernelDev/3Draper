# Trunk configuration for 3Draper WASM viewer build
# https://trunkrs.dev/configuration/

[build]
# Only build the viewer crate, not the whole workspace.
# This avoids pulling in draper-cloud (tokio) and draper-testing
# which have C dependencies that don't compile on wasm32.
target = "index.html"
dist = "dist"
cargo_flags = ["--package", "draper-viewer", "--no-default-features", "--features", "web"]

[watch]
ignore = ["../../target"]

[serve]
# Local development server (not used in CI)
address = "127.0.0.1"
port = 8080

# Cross-Origin Isolation headers for SharedArrayBuffer support.
# Required for WASM parallel threading (wasm-bindgen-rayon).
# Without these headers, the browser will not expose SharedArrayBuffer,
# and the triangulation will fall back to single-threaded mode.
[[serve.headers]]
source = "**"
headers = [
    { key = "Cross-Origin-Opener-Policy", value = "same-origin" },
    { key = "Cross-Origin-Embedder-Policy", value = "require-corp" },
]

# Additional headers for security and WASM support
[[serve.headers]]
source = "**/*.wasm"
headers = [
    { key = "Content-Type", value = "application/wasm" },
]
