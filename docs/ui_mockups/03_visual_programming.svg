    <circle cx="740" cy="140" r="1"/><circle cx="780" cy="140" r="1"/><circle cx="820" cy="140" r="1"/><circle cx="860" cy="140" r="1"/>
    <circle cx="900" cy="140" r="1"/><circle cx="940" cy="140" r="1"/><circle cx="980" cy="140" r="1"/><circle cx="1020" cy="140" r="1"/>
