  <rect x="1164" y="446" width="130" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="1229" y="462" fill="#89b4fa" font-size="9" text-anchor="middle">Von Mises</text>
  <rect x="1300" y="446" width="130" height="24" rx="3" fill="#313244"/>
  <text x="1365" y="462" fill="#6c7086" font-size="9" text-anchor="middle">Displacement</text>
  <rect x="1164" y="474" width="130" height="24" rx="3" fill="#313244"/>
  <text x="1229" y="490" fill="#6c7086" font-size="9" text-anchor="middle">Strain</text>
  <rect x="1300" y="474" width="130" height="24" rx="3" fill="#313244"/>
  <text x="1365" y="490" fill="#6c7086" font-size="9" text-anchor="middle">Stress XX</text>

  <!-- Animation controls -->
  <rect x="1164" y="510" width="272" height="3" fill="#45475a"/>
  <text x="1170" y="528" fill="#cdd6f4" font-size="10" font-weight="bold">Animation</text>
  <rect x="1164" y="536" width="30" height="24" rx="3" fill="#313244"/>
  <text x="1179" y="552" fill="#a6e3a1" font-size="12" text-anchor="middle">▶</text>
  <rect x="1200" y="536" width="30" height="24" rx="3" fill="#313244"/>
  <text x="1215" y="552" fill="#a6adc8" font-size="12" text-anchor="middle">⏸</text>
  <rect x="1236" y="536" width="196" height="24" rx="3" fill="#313244"/>
  <rect x="1240" y="540" width="100" height="16" rx="2" fill="#89b4fa" opacity="0.5"/>
  <text x="1340" y="552" fill="#a6adc8" font-size="9" text-anchor="middle">0.42mm / 50×</text>

  <!-- Bottom status -->
  <rect x="0" y="840" width="1440" height="60" fill="#11111b"/>
  <text x="8" y="878" fill="#a6e3a1" font-size="10">FEA: Solved — 147 iterations, 0.83s</text>
  <text x="500" y="878" fill="#6c7086" font-size="10">Nodes: 12,847  Elements: 8,234</text>
  <text x="800" y="878" fill="#f38ba8" font-size="10">Max Stress: 245 MPa</text>
  <text x="1000" y="878" fill="#89dceb" font-size="10">Max Disp: 0.42mm</text>
