  <rect x="1160" y="68" width="280" height="28" fill="#11111b"/>
  <text x="1170" y="86" fill="#cdd6f4" font-size="11" font-weight="bold">Analysis Results</text>

  <rect x="1164" y="104" width="272" height="22" fill="#313244"/>
  <text x="1170" y="119" fill="#a6adc8" font-size="10">Study Type</text>
  <text x="1260" y="119" fill="#cdd6f4" font-size="10">Static</text>
  <rect x="1164" y="128" width="272" height="22" fill="none"/>
  <text x="1170" y="143" fill="#a6adc8" font-size="10">Solver</text>
  <text x="1260" y="143" fill="#cdd6f4" font-size="10">CG Iterative</text>
  <rect x="1164" y="152" width="272" height="22" fill="#313244"/>
  <text x="1170" y="167" fill="#a6adc8" font-size="10">Iterations</text>
  <text x="1260" y="167" fill="#a6e3a1" font-size="10">147 / 1000</text>
  <rect x="1164" y="176" width="272" height="22" fill="none"/>
  <text x="1170" y="191" fill="#a6adc8" font-size="10">Converged</text>
  <text x="1260" y="191" fill="#a6e3a1" font-size="10">✓ Yes (1e-7)</text>

  <!-- Key results -->
  <rect x="1164" y="210" width="272" height="3" fill="#45475a"/>
  <text x="1170" y="228" fill="#cdd6f4" font-size="10" font-weight="bold">Key Results</text>

  <rect x="1164" y="236" width="272" height="40" rx="4" fill="#313244"/>
  <text x="1170" y="252" fill="#a6adc8" font-size="9">Max Von Mises</text>
  <text x="1170" y="268" fill="#f38ba8" font-size="14" font-weight="bold">245.3 MPa</text>

  <rect x="1164" y="280" width="272" height="40" rx="4" fill="#313244"/>
  <text x="1170" y="296" fill="#a6adc8" font-size="9">Max Displacement</text>
  <text x="1170" y="312" fill="#89dceb" font-size="14" font-weight="bold">0.42 mm</text>

  <rect x="1164" y="324" width="272" height="40" rx="4" fill="#313244"/>
  <text x="1170" y="340" fill="#a6adc8" font-size="9">Safety Factor</text>
  <text x="1170" y="356" fill="#f9e2af" font-size="14" font-weight="bold">2.16</text>

  <rect x="1164" y="368" width="272" height="40" rx="4" fill="#313244"/>
  <text x="1170" y="384" fill="#a6adc8" font-size="9">Total Mass</text>
  <text x="1170" y="400" fill="#cdd6f4" font-size="14" font-weight="bold">1.247 kg</text>

  <!-- Result type selector -->
