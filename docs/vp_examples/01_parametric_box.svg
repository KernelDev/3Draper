<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
<rect width="800" height="350" fill="#0d0d1a"/>
<!-- Dotted grid -->
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="0" cy="0" r="1" fill="rgba(137,180,250,0.05)"/>
  </pattern>
</defs>
<rect width="800" height="350" fill="url(#grid)"/>
<text x="400.0" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Example 1: Parametric Box</text>

<rect x="100" y="80" width="200" height="120" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
<rect x="100" y="80" width="200" height="22" rx="8" fill="#89b4fa"/>
<rect x="100" y="94" width="200" height="8" fill="#89b4fa"/>
<text x="110" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e1e2e">Box</text>
<text x="290" y="95" font-family="sans-serif" font-size="9" fill="#1e1e2e" text-anchor="end">#1</text>
<text x="110" y="120" font-family="monospace" font-size="10" fill="#cdd6f4">W: 100  H: 80  D: 50</text>
<circle cx="300" cy="140.0" r="6" fill="#1e1e2e"/>
<circle cx="300" cy="140.0" r="4.5" fill="#89b4fa"/>
<text x="290" y="143.0" font-family="sans-serif" font-size="9" fill="#a6adc8" text-anchor="end">G</text>
<rect x="500" y="95" width="200" height="90" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
<rect x="500" y="95" width="200" height="22" rx="8" fill="#f38ba8"/>
<rect x="500" y="109" width="200" height="8" fill="#f38ba8"/>
<text x="510" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e1e2e">Bake to Doc</text>
<text x="690" y="110" font-family="sans-serif" font-size="9" fill="#1e1e2e" text-anchor="end">#1</text>
<circle cx="500" cy="140.0" r="6" fill="#1e1e2e"/>
<circle cx="500" cy="140.0" r="4.5" fill="#89b4fa"/>
<text x="510" y="143.0" font-family="sans-serif" font-size="9" fill="#a6adc8">G</text>
<path d="M300,140.0 C400.0,140.0 400.0,140.0 500,140.0" stroke="#89b4fa" stroke-width="2.5" fill="none" opacity="0.85"/>
<text x="400" y="300" font-family="sans-serif" font-size="11" fill="#a6adc8" text-anchor="middle">Result: 100×80×50 box appears in viewport</text>
</svg>
