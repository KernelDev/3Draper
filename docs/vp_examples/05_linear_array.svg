<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
<rect width="900" height="350" fill="#0d0d1a"/>
<!-- Dotted grid -->
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="0" cy="0" r="1" fill="rgba(137,180,250,0.05)"/>
  </pattern>
</defs>
<rect width="900" height="350" fill="url(#grid)"/>
<text x="450.0" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Example 5: Linear Array — replicate Box N times</text>

<rect x="30" y="100" width="200" height="120" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
<rect x="30" y="100" width="200" height="22" rx="8" fill="#89b4fa"/>
<rect x="30" y="114" width="200" height="8" fill="#89b4fa"/>
<text x="40" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e1e2e">Box</text>
<text x="220" y="115" font-family="sans-serif" font-size="9" fill="#1e1e2e" text-anchor="end">#1</text>
<text x="40" y="140" font-family="monospace" font-size="10" fill="#cdd6f4">W: 30  H: 30  D: 30</text>
<circle cx="230" cy="160.0" r="6" fill="#1e1e2e"/>
<circle cx="230" cy="160.0" r="4.5" fill="#89b4fa"/>
<text x="220" y="163.0" font-family="sans-serif" font-size="9" fill="#a6adc8" text-anchor="end">G</text>
<rect x="380" y="90" width="200" height="130" rx="8" fill="#313244" stroke="#fab387" stroke-width="2"/>
<rect x="380" y="90" width="200" height="22" rx="8" fill="#fab387"/>
<rect x="380" y="104" width="200" height="8" fill="#fab387"/>
<text x="390" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e1e2e">Linear Array</text>
<text x="570" y="105" font-family="sans-serif" font-size="9" fill="#1e1e2e" text-anchor="end">#1</text>
<text x="390" y="130" font-family="monospace" font-size="10" fill="#cdd6f4">N: 5  S: 50</text>
<circle cx="380" cy="155.0" r="6" fill="#1e1e2e"/>
<circle cx="380" cy="155.0" r="4.5" fill="#89b4fa"/>
<text x="390" y="158.0" font-family="sans-serif" font-size="9" fill="#a6adc8">G</text>
<circle cx="580" cy="155.0" r="6" fill="#1e1e2e"/>
<circle cx="580" cy="155.0" r="4.5" fill="#89b4fa"/>
<text x="570" y="158.0" font-family="sans-serif" font-size="9" fill="#a6adc8" text-anchor="end">G</text>
<rect x="700" y="105" width="180" height="90" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
<rect x="700" y="105" width="180" height="22" rx="8" fill="#f38ba8"/>
<rect x="700" y="119" width="180" height="8" fill="#f38ba8"/>
<text x="710" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e1e2e">Bake</text>
<text x="870" y="120" font-family="sans-serif" font-size="9" fill="#1e1e2e" text-anchor="end">#1</text>
<circle cx="700" cy="150.0" r="6" fill="#1e1e2e"/>
<circle cx="700" cy="150.0" r="4.5" fill="#89b4fa"/>
<text x="710" y="153.0" font-family="sans-serif" font-size="9" fill="#a6adc8">G</text>
<path d="M230,160.0 C305.0,160.0 305.0,155.0 380,155.0" stroke="#89b4fa" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M580,155.0 C640.0,155.0 640.0,150.0 700,150.0" stroke="#89b4fa" stroke-width="2.5" fill="none" opacity="0.85"/>
<text x="450" y="320" font-family="sans-serif" font-size="11" fill="#a6adc8" text-anchor="middle">Result: 5 boxes in a row, each 50 units apart</text>
</svg>
