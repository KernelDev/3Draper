<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3Draper — 3D Geometric Kernel</title>
    <meta name="description" content="3Draper: A 3D geometric kernel with B-Rep topology, STEP/STL I/O, and interactive 3D viewer running entirely in your browser via WebAssembly.">
    
<script type="module">
import init, * as bindings from '/draper-viewer-95099ac981288df6.js';
const wasm = await init({ module_or_path: '/draper-viewer-95099ac981288df6_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e8e9ef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }
        #the_canvas_id {
            width: 100%;
            height: 100vh;
            display: block;
            touch-action: none; /* Prevent browser from intercepting touch gestures */
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e8e9ef;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #loading .logo {
            font-size: 32px;
            font-weight: 700;
            color: #3a5a8c;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }
        #loading .logo span {
            color: #556677;
            font-weight: 300;
            font-size: 18px;
            margin-left: 8px;
        }
        #loading .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(58, 90, 140, 0.2);
            border-top: 3px solid #3a5a8c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loading .status {
            margin-top: 20px;
            color: #556677;
            font-size: 14px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<link rel="modulepreload" href="/draper-viewer-95099ac981288df6.js" crossorigin="anonymous" integrity="sha384-5nFWwyolqDOAs41mGmKvmSiSsbeR2UXxKH5ydrp+BcRUQCxsngdZ6f0JHrFbHAI7"><link rel="preload" href="/draper-viewer-95099ac981288df6_bg.wasm" crossorigin="anonymous" integrity="sha384-uem1jxu6i8EmHo0WxgqpZ0WW/D7yvBAM86X+hjvg7vhiFHyBZ+mTf3iHqJcPfX/c" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">
        <div class="logo">3Draper<span>Viewer</span></div>
        <div class="spinner"></div>
        <div class="status">Loading WebAssembly module...</div>
    </div>
    <canvas id="the_canvas_id"></canvas>
    <script>
        // Hide loading overlay once WASM application has fully started
        var loadingEl = document.getElementById("loading");
        function hideLoading() {
            if (loadingEl) {
                loadingEl.classList.add("fade-out");
                setTimeout(function() { loadingEl.style.display = "none"; }, 600);
            }
        }
        // Listen for the TrunkApplicationStarted event (dispatched after WASM init)
        window.addEventListener("TrunkApplicationStarted", function() {
            setTimeout(hideLoading, 100);
        });
        // Fallback: hide after 15 seconds even if WASM fails to load
        setTimeout(hideLoading, 15000);
    </script>
</body>
</html>
